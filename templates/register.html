<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Club Etla Rewards - Registro</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
        .register-card {
            background: rgba(255,252,248,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            padding: 36px 28px 32px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: var(--shadow-card);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .register-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-card);
            padding: 1px;
            background: linear-gradient(135deg,
                    rgba(255,255,255,0.6) 0%,
                    rgba(255,255,255,0.1) 30%,
                    rgba(255,255,255,0.05) 60%,
                    rgba(255,255,255,0.3) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .register-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .register-title { text-align: center; margin-bottom: 24px; }
        .register-title h1 { font-size: 24px; font-weight: 800; color: var(--etla-black); letter-spacing: -0.3px; }
        .register-title p { font-size: 14px; color: var(--etla-black); margin-top: 4px; font-weight: 400; opacity: 0.6; }

        .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: var(--etla-black); opacity: 0.6; }

        .message-error {
            color: #e74c3c;
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            background: rgba(231,76,60,0.04);
            border: 1px solid rgba(231,76,60,0.08);
            display: none;
        }

        .message-error.visible { display: block; }

        @media (max-width: 400px) {
            .register-card { padding: 28px 18px 24px; }
            .register-title h1 { font-size: 20px; }
        }
    .input-group select{width:100%;padding:16px 16px 16px 52px;font-size:16px;font-weight:500;font-family:inherit;background:#fff;border:2px solid rgba(0,0,0,0.06);border-radius:16px;color:#000;outline:none;appearance:none;-webkit-appearance:none;}
        .input-group select:focus{border-color:#4a8c2a;}

/* IDENTIDAD TIPOGRÁFICA OFICIAL CLUB ETLA */
.premium-header .title-row .club {
    font-family: 'Inter', sans-serif !important;
    font-weight: 900 !important;
    color: #000000 !important;
    font-style: normal !important;
}

.premium-header .title-row .etla {
    font-family: 'Dancing Script', cursive !important;
    font-style: italic !important;
    font-weight: 700 !important;
    color: #62B747 !important;
    -webkit-text-fill-color: #62B747 !important;
    background: none !important;
}

.premium-header .sub {
    font-family: 'Inter', sans-serif !important;
    color: #000000 !important;
    text-transform: uppercase !important;
    letter-spacing: 3px !important;
    font-weight: 700 !important;
}


/* IDENTIDAD OFICIAL CLUB ETLA */
.premium-header .title-row .club {
    font-family: 'Inter', sans-serif !important;
    font-size: clamp(28px, 8vw, 42px) !important;
    font-weight: 900 !important;
    font-style: normal !important;
    color: #000000 !important;
}

.premium-header .title-row .etla {
    font-family: 'Dancing Script', cursive !important;
    font-size: clamp(38px, 10vw, 54px) !important;
    font-weight: 700 !important;
    font-style: normal !important;
    color: #62B747 !important;
    -webkit-text-fill-color: #62B747 !important;
    background: none !important;
}

.premium-header .sub {
    font-family: 'Inter', sans-serif !important;
    color: #000000 !important;
    text-transform: uppercase !important;
    letter-spacing: 3px !important;
    font-weight: 700 !important;
}

</style>
    <link rel="stylesheet" href="/static/fonts.css" />
</head>
<body>

    <div class="sparkle"></div><div class="sparkle"></div>
    <div class="sparkle"></div><div class="sparkle"></div>
    <div class="sparkle"></div><div class="sparkle"></div>

    <div class="container">

        <div class="premium-header fade-up">
            <div class="tag">★ MI TARJETA</div>
            <div class="title-row">
                <span class="club">MI CLUB</span>
                <span class="etla">ETLA</span>
            </div>
            <div class="sub">Club de Nutrición Etla</div>
        </div>

        <div class="register-card fade-up fade-up-delay-1">
            <div class="register-title">
                <h1>🎉 Registro</h1>
                <p>Únete al Club y obtén recompensas</p>
            </div>

            <form id="registerForm" method="POST" action="/register">
                <div class="input-group">
                    <input type="text" id="name" name="name" placeholder="Nombre completo" required />
                    <span class="input-icon">👤</span>
                </div>

                <div class="input-group">
                    <input type="tel" id="whatsapp" name="whatsapp" placeholder="WhatsApp: +5215512345678" value="{{ phone if phone else '+52' }}" required autocomplete="tel" />
                    <span class="input-icon">📱</span>
                </div>

                <div class="input-group">
                    <input type="date" id="birthday" name="birthday" placeholder="Fecha de nacimiento" />
                    <span class="input-icon">🎂</span>
                </div>
                <div class="input-group">
                    <input type="text" id="referral" name="referral" placeholder="Código de referido (opcional)" value="{{ ref_code or '' }}" autocapitalize="characters" />
                    <span class="input-icon">🔗</span>
                </div>

                <div class="input-group">
                    <select id="source" name="source" required>
                        <option value="" disabled {% if not ref_code %}selected{% endif %}>¿Cómo conociste la tarjeta?</option>
                        <option value="anfitrion">Me la mostró el anfitrión del club</option>
                        <option value="redes">La vi en redes sociales</option>
                        <option value="amigo" {% if ref_code %}selected{% endif %}>Un amigo o conocido</option>
                    </select>
                    <span class="input-icon">📍</span>
                </div>
                <div class="input-group" id="sourceDetailBox" style="display:none;">
                    <select id="source_detail" name="source_detail">
                        <option value="Instagram">Instagram</option>
                        <option value="Facebook">Facebook</option>
                        <option value="TikTok">TikTok</option>
                        <option value="WhatsApp">WhatsApp</option>
                        <option value="Otra">Otra</option>
                    </select>
                    <span class="input-icon">📲</span>
                </div>
                <script>
                    (function(){
                        var s = document.getElementById('source'), b = document.getElementById('sourceDetailBox'), d = document.getElementById('source_detail');
                        s.addEventListener('change', function(){ var on = s.value === 'redes'; b.style.display = on ? 'block' : 'none'; d.disabled = !on; });
                        d.disabled = true;
                    })();
                </script>

                <button type="submit" class="btn btn-primary" id="registerBtn">
                    Registrarme
                    <span style="font-size:20px;">🎉</span>
                </button>

                <div class="message-error" id="messageError"></div>
            </form>

            <div class="login-link">
                ¿Ya tienes cuenta? <a href="/login" class="link">Inicia sesión</a>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const messageError = document.getElementById('messageError');

            try {
                const response = await fetch('/register', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = data.redirect || '/card';
                } else if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    messageError.textContent = data.error || 'Error al registrar';
                    messageError.classList.add('visible');
                    setTimeout(() => messageError.classList.remove('visible'), 5000);
                }
            } catch (error) {
                console.error('Error:', error);
                messageError.textContent = 'Error de conexión. Intenta de nuevo.';
                messageError.classList.add('visible');
                setTimeout(() => messageError.classList.remove('visible'), 5000);
            }
        });

        document.querySelectorAll('#registerForm input').forEach(input => {
            input.addEventListener('input', function() {
                const messageError = document.getElementById('messageError');
                messageError.classList.remove('visible');
            });
        });

        document.getElementById('registerBtn').addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    </script>

</body>
</html>
