<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Club Etla Rewards - Iniciar Sesión</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <style>
        .login-card {
            background: rgba(255,252,248,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            padding: 36px 28px 32px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: var(--shadow-card);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-card);
            padding: 1px;
            background: linear-gradient(135deg,
                    rgba(255,255,255,0.6) 0%,
                    rgba(255,255,255,0.1) 30%,
                    rgba(255,255,255,0.05) 60%,
                    rgba(255,255,255,0.3) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .login-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .login-title { text-align: center; margin-bottom: 24px; }
        .login-title h1 { font-size: 24px; font-weight: 800; color: var(--etla-black); letter-spacing: -0.3px; }
        .login-title p { font-size: 14px; color: var(--etla-black); margin-top: 4px; font-weight: 400; opacity: 0.6; }

        .btn-login .arrow { font-size: 20px; transition: transform 0.3s ease; }
        .btn-login:hover .arrow { transform: translateX(4px); }

        .register-link { text-align: center; margin-top: 20px; font-size: 14px; color: var(--etla-black); opacity: 0.6; }

        .message-error {
            color: #e74c3c;
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            background: rgba(231,76,60,0.04);
            border: 1px solid rgba(231,76,60,0.08);
            display: none;
        }

        .message-error.visible { display: block; }

        @media (max-width: 400px) {
            .login-card { padding: 28px 18px 24px; }
            .login-title h1 { font-size: 20px; }
        }
    </style>
</head>
<body>

    <div class="sparkle"></div><div class="sparkle"></div>
    <div class="sparkle"></div><div class="sparkle"></div>
    <div class="sparkle"></div><div class="sparkle"></div>

    <div class="container">

        <div class="premium-header fade-up">
            <div class="tag">★ MI TARJETA</div>
            <div class="title-row">
                <span class="club">MI CLUB</span>
                <span class="etla">ETLA</span>
            </div>
            <div class="sub">Club de Nutrición Etla</div>
        </div>

        <div class="login-card fade-up fade-up-delay-1">
            <div class="login-title">
                <h1>🔑 Iniciar sesión</h1>
                <p>Ingresa tu número de WhatsApp</p>
            </div>

            <form id="loginForm" method="POST" action="/login">
                <div class="input-group">
                    <input type="tel" id="whatsapp" name="whatsapp" placeholder="Ej: +5215512345678" required autocomplete="tel" />
                    <span class="input-icon">📱</span>
                </div>

                <button type="submit" class="btn btn-primary btn-login" id="loginBtn">
                    Continuar
                    <span class="arrow">→</span>
                </button>

                <div class="message-error" id="messageError"></div>
            </form>

            <div class="register-link">
                ¿No tienes cuenta? <a href="/register" class="link">Regístrate</a>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const messageError = document.getElementById('messageError');

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = data.redirect || '/card';
                } else if (data.redirect_to_register) {
                    window.location.href = data.redirect_to_register;
                } else {
                    messageError.textContent = data.error || 'Error al iniciar sesión';
                    messageError.classList.add('visible');
                    setTimeout(() => messageError.classList.remove('visible'), 5000);
                }
            } catch (error) {
                console.error('Error:', error);
                messageError.textContent = 'Error de conexión. Intenta de nuevo.';
                messageError.classList.add('visible');
                setTimeout(() => messageError.classList.remove('visible'), 5000);
            }
        });

        document.getElementById('whatsapp').addEventListener('input', function() {
            const messageError = document.getElementById('messageError');
            messageError.classList.remove('visible');
        });

        document.querySelector('.btn-login').addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    </script>

</body>
</html>
