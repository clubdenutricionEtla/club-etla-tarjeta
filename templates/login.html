        .login-card {
            background: rgba(255,252,248,0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: var(--radius-card);
            padding: 36px 28px 32px;
            width: 100%;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: var(--shadow-card);
            transition: box-shadow 0.3s ease, transform 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: var(--radius-card);
            padding: 1px;
            background: linear-gradient(135deg,
                    rgba(255,255,255,0.6) 0%,
                    rgba(255,255,255,0.1) 30%,
                    rgba(255,255,255,0.05) 60%,
                    rgba(255,255,255,0.3) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .login-card:hover {
            box-shadow: var(--shadow-hover);
            transform: translateY(-2px);
        }

        .login-title { text-align: center; margin-bottom: 24px; }
        .login-title h1 { font-size: 24px; font-weight: 800; color: var(--etla-black); letter-spacing: -0.3px; }
        .login-title p { font-size: 14px; color: var(--etla-black); margin-top: 4px; font-weight: 400; opacity: 0.6; }

        .btn-login .arrow { font-size: 20px; transition: transform 0.3s ease; }
        .btn-login:hover .arrow { transform: translateX(4px); }

        .register-link { text-align: center; margin-top: 20px; font-size: 14px; color: var(--etla-black); opacity: 0.6; }

        .message-error {
            color: #e74c3c;
            font-size: 13px;
            font-weight: 500;
            margin-top: 12px;
            text-align: center;
            padding: 10px;
            border-radius: 12px;
            background: rgba(231,76,60,0.04);
            border: 1px solid rgba(231,76,60,0.08);
            display: none;
        }

        .message-error.visible { display: block; }

        @media (max-width: 400px) {
            .login-card { padding: 28px 18px 24px; }
            .login-title h1 { font-size: 20px; }
        }

/* ===== CLUB ETLA: SISTEMA HOLOGRAFICO PREMIUM ===== */

body {
    isolation: isolate;
}

.etla-holo-layer {
    position: fixed;
    inset: -20%;
    z-index: -1;
    pointer-events: none;
    opacity: .85;
    background:
        radial-gradient(ellipse at 15% 25%,
            rgba(255,190,205,.27), transparent 45%),
        radial-gradient(ellipse at 80% 20%,
            rgba(160,220,255,.24), transparent 45%),
        radial-gradient(ellipse at 70% 80%,
            rgba(190,160,255,.22), transparent 45%),
        radial-gradient(ellipse at 20% 80%,
            rgba(150,220,145,.25), transparent 45%),
        radial-gradient(ellipse at 50% 50%,
            rgba(255,230,170,.20), transparent 55%);
    background-size: 180% 180%;
    animation: etlaIridescent 16s ease-in-out infinite alternate;
}

.etla-holo-layer::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(
        115deg,
        transparent 25%,
        rgba(255,255,255,.24) 43%,
        rgba(190,220,255,.12) 50%,
        rgba(255,220,235,.18) 56%,
        transparent 72%
    );
    background-size: 220% 100%;
    animation: etlaHoloSweep 11s ease-in-out infinite;
}

@keyframes etlaIridescent {
    0% {
        transform: translate(-2%, -1%) scale(1);
        filter: hue-rotate(0deg);
    }
    50% {
        transform: translate(2%, 2%) scale(1.06);
    }
    100% {
        transform: translate(-1%, 3%) scale(1.02);
        filter: hue-rotate(18deg);
    }
}

@keyframes etlaHoloSweep {
    0%, 100% { background-position: 150% 0; }
    50% { background-position: -100% 0; }
}

/* Tarjetas: cristal y reflejo tornasol */
.premium-card {
    border: 1px solid rgba(255,255,255,.75);
    box-shadow:
        0 12px 38px rgba(65,75,55,.10),
        inset 0 1px 0 rgba(255,255,255,.85);
}

.holo-overlay {
    display: block !important;
    opacity: .65;
    mix-blend-mode: soft-light;
    background-size: 180% 180%;
    animation:
        holoGlow 8s ease-in-out infinite,
        holoSweepCard 12s ease-in-out infinite;
}

/* Navegación inferior: cristal iridiscente */
.bottom-nav {
    overflow: hidden;
    border-top: 1px solid rgba(255,255,255,.8) !important;
    background: rgba(255,255,255,.76) !important;
    box-shadow:
        0 -8px 35px rgba(75,90,65,.10),
        inset 0 1px 0 rgba(255,255,255,.9);
}

.bottom-nav::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    background: linear-gradient(
        105deg,
        transparent 20%,
        rgba(255,190,215,.20) 38%,
        rgba(180,220,255,.24) 50%,
        rgba(190,230,170,.22) 62%,
        transparent 80%
    );
    background-size: 220% 100%;
    animation: etlaNavShine 9s ease-in-out infinite;
}

@keyframes etlaNavShine {
    0%, 100% { background-position: 130% 0; }
    50% { background-position: -100% 0; }
}

.nav-btn {
    position: relative;
    z-index: 1;
    overflow: hidden;
    transition: background .3s, box-shadow .3s, color .3s;
}

.nav-btn.active {
    color: #2d7a2d !important;
    background: linear-gradient(
        135deg,
        rgba(45,122,45,.13),
        rgba(212,160,23,.13),
        rgba(190,220,255,.16)
    ) !important;
    box-shadow:
        inset 0 0 0 1px rgba(255,255,255,.85),
        0 2px 12px rgba(45,122,45,.12);
    border-radius: 14px;
}

.nav-btn.active::after {
    content: "";
    position: absolute;
    top: 0;
    bottom: 0;
    left: -100%;
    width: 65%;
    pointer-events: none;
    background: linear-gradient(
        90deg, transparent,
        rgba(255,255,255,.65),
        transparent
    );
    animation: etlaActiveShine 4s ease-in-out infinite;
}

@keyframes etlaActiveShine {
    0%, 65%, 100% { left: -100%; }
    85% { left: 140%; }
}

/* Accesibilidad */
@media (prefers-reduced-motion: reduce) {
    .etla-holo-layer,
    .etla-holo-layer::after,
    .bottom-nav::before,
    .nav-btn.active::after,
    .holo-overlay {
        animation: none !important;
    }
}

<body>
<div class="etla-holo-layer" aria-hidden="true"></div>


    <div class="sparkle"></div><div class="sparkle"></div>
    <div class="sparkle"></div><div class="sparkle"></div>
    <div class="sparkle"></div><div class="sparkle"></div>

    <div class="container">

        <div class="premium-header fade-up">
            <div class="tag">★ MI TARJETA</div>
            <div class="logo-club-wrap"><img class="logo-club-etla" src="/static/images/logo-club-etla.png" alt="Club de Nutrición Etla"></div>
            <div class="sub">Club de Nutrición Etla</div>
        </div>

        <div class="login-card fade-up fade-up-delay-1">
            <div class="login-title">
                <h1>🔑 Iniciar sesión</h1>
                <p>Ingresa tu número de WhatsApp</p>
            </div>

            <form id="loginForm" method="POST" action="/login">
                <div class="input-group">
                    <input type="tel" id="whatsapp" name="whatsapp" placeholder="Ej: +5215512345678" required autocomplete="tel" />
                    <span class="input-icon">📱</span>
                </div>

                <button type="submit" class="btn btn-primary btn-login" id="loginBtn">
                    Continuar
                    <span class="arrow">→</span>
                </button>

                <div class="message-error" id="messageError"></div>
            </form>

            <div class="register-link">
                ¿No tienes cuenta? <a href="/register" class="link">Regístrate</a>
            </div>
        </div>

    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData(this);
            const messageError = document.getElementById('messageError');

            try {
                const response = await fetch('/login', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    window.location.href = data.redirect || '/card';
                } else if (data.redirect_to_register) {
                    window.location.href = data.redirect_to_register;
                } else {
                    messageError.textContent = data.error || 'Error al iniciar sesión';
                    messageError.classList.add('visible');
                    setTimeout(() => messageError.classList.remove('visible'), 5000);
                }
            } catch (error) {
                console.error('Error:', error);
                messageError.textContent = 'Error de conexión. Intenta de nuevo.';
                messageError.classList.add('visible');
                setTimeout(() => messageError.classList.remove('visible'), 5000);
            }
        });

        document.getElementById('whatsapp').addEventListener('input', function() {
            const messageError = document.getElementById('messageError');
            messageError.classList.remove('visible');
        });

        document.querySelector('.btn-login').addEventListener('click', function(e) {
            const ripple = document.createElement('span');
            ripple.classList.add('ripple');
            const rect = this.getBoundingClientRect();
            const size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = size + 'px';
            ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
            ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
            this.appendChild(ripple);
            setTimeout(() => ripple.remove(), 600);
        });
    </script>

</body>
