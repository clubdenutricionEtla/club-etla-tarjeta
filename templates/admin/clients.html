<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Clientes - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#0a0a1a;color:white;min-height:100vh;padding:20px;}
        .container{max-width:1200px;margin:0 auto;}
        .back{color:rgba(255,255,255,0.1);text-decoration:none;font-size:13px;display:inline-block;margin-bottom:16px;transition:color 0.3s;}
        .back:hover{color:#00ff87;}
        .header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
        .header h1{font-size:24px;background:linear-gradient(135deg,#00ff87,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
        .header .sub{color:rgba(255,255,255,0.15);font-size:13px;}
        
        .search-box{display:flex;gap:10px;margin-bottom:16px;}
        .search-box input{flex:1;padding:10px 14px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);border-radius:10px;color:white;font-size:13px;outline:none;}
        .search-box input:focus{border-color:rgba(0,255,135,0.08);}
        .search-box button{padding:10px 20px;background:linear-gradient(135deg,#00ff87,#00d4ff);border:none;border-radius:10px;color:#0a0a0a;font-weight:600;cursor:pointer;}
        
        .clients-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}
        .client-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);border-radius:12px;padding:16px;transition:all 0.3s;}
        .client-card:hover{background:rgba(255,255,255,0.04);transform:translateY(-2px);}
        .client-card .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
        .client-card .name{font-weight:600;font-size:14px;color:white;}
        .client-card .status{font-size:9px;padding:2px 10px;border-radius:12px;font-weight:600;}
        .status.active{background:rgba(0,255,135,0.1);color:#00ff87;border:1px solid rgba(0,255,135,0.05);}
        .status.inactive{background:rgba(255,50,50,0.1);color:#ff6b6b;border:1px solid rgba(255,50,50,0.05);}
        .client-card .info{font-size:11px;color:rgba(255,255,255,0.15);display:flex;gap:12px;flex-wrap:wrap;}
        .client-card .info span{display:flex;align-items:center;gap:4px;}
        .client-card .actions{display:flex;gap:6px;margin-top:10px;}
        .client-card .actions .btn{padding:4px 12px;border:none;border-radius:6px;font-size:10px;font-weight:600;cursor:pointer;transition:all 0.3s;}
        .btn-edit{background:rgba(0,255,135,0.05);color:#00ff87;border:1px solid rgba(0,255,135,0.05);}
        .btn-edit:hover{background:rgba(0,255,135,0.08);}
        .btn-delete{background:rgba(255,50,50,0.05);color:#ff6b6b;border:1px solid rgba(255,50,50,0.05);}
        .btn-delete:hover{background:rgba(255,50,50,0.08);}
        
        .empty{text-align:center;padding:40px;color:rgba(255,255,255,0.05);font-size:13px;}
        
        .modal{display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.8);z-index:999;align-items:center;justify-content:center;padding:20px;}
        .modal.show{display:flex;}
        .modal-content{background:#1a1a2e;border-radius:16px;padding:24px;max-width:400px;width:100%;}
        .modal-content h3{color:white;margin-bottom:12px;}
        .modal-content .row{display:flex;gap:10px;margin-top:12px;}
        .modal-content .row button{flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;cursor:pointer;}
        .btn-confirm{background:#ff6b6b;color:white;}
        .btn-cancel{background:rgba(255,255,255,0.05);color:rgba(255,255,255,0.3);}
    </style>
</head>
<body>
    <div class="container">
        <a href="/admin" class="back">← Volver al panel</a>
        
        <div class="header">
            <div>
                <h1>👥 Clientes</h1>
                <span class="sub">Gestiona todos los clientes del club</span>
            </div>
            <span style="font-size:12px;color:rgba(255,255,255,0.05);" id="clientCount">0 clientes</span>
        </div>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar por nombre, WhatsApp o ID..." onkeypress="if(event.key==='Enter') searchClients()">
            <button onclick="searchClients()">🔍 Buscar</button>
            <button onclick="loadClients()" style="background:rgba(255,255,255,0.02);color:rgba(255,255,255,0.2);border:1px solid rgba(255,255,255,0.02);">🔄</button>
        </div>
        
        <div class="clients-grid" id="clientsGrid">
            <div class="empty">Cargando clientes...</div>
        </div>
    </div>
    
    <!-- Modal de confirmación -->
    <div class="modal" id="deleteModal">
        <div class="modal-content">
            <h3>⚠️ Eliminar Cliente</h3>
            <p style="color:rgba(255,255,255,0.2);font-size:13px;margin-bottom:8px;">¿Estás seguro de eliminar este cliente? Se perderá todo su historial.</p>
            <p style="color:rgba(255,255,255,0.05);font-size:11px;" id="deleteClientName"></p>
            <div class="row">
                <button class="btn-confirm" onclick="confirmDelete()">Eliminar</button>
                <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
            </div>
        </div>
    </div>
    
    <script>
        let deleteId = null;
        
        function loadClients(){
            fetch('/api/admin/clients')
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('clientsGrid');
                    document.getElementById('clientCount').textContent = data.length + ' clientes';
                    if(data.length === 0){
                        grid.innerHTML = '<div class="empty">No hay clientes registrados</div>';
                        return;
                    }
                    grid.innerHTML = data.map(c => `
                        <div class="client-card">
                            <div class="top">
                                <span class="name">${c.name}</span>
                                <span class="status ${c.status === 'active' ? 'active' : 'inactive'}">${c.status.toUpperCase()}</span>
                            </div>
                            <div class="info">
                                <span>📱 ${c.whatsapp}</span>
                                <span>👁️ ${c.visits} visitas</span>
                                <span>⭐ ${c.points} pts</span>
                                <span>🏆 ${c.level}</span>
                            </div>
                            <div class="info" style="font-size:10px;color:rgba(255,255,255,0.05);">
                                <span>📅 ${c.registration_date || '—'}</span>
                                <span>🔗 ${c.referral_code || '—'}</span>
                            </div>
                            <div class="actions">
                                <button class="btn btn-edit" onclick="editClient(${c.id})">✏️ Editar</button>
                                <button class="btn btn-delete" onclick="openDelete(${c.id}, '${c.name}')">🗑️ Eliminar</button>
                            </div>
                        </div>
                    `).join('');
                })
                .catch(() => {
                    document.getElementById('clientsGrid').innerHTML = '<div class="empty">❌ Error al cargar clientes</div>';
                });
        }
        
        function searchClients(){
            const search = document.getElementById('searchInput').value.trim();
            if(!search){ loadClients(); return; }
            fetch('/api/admin/clients?search='+encodeURIComponent(search))
                .then(res => res.json())
                .then(data => {
                    const grid = document.getElementById('clientsGrid');
                    if(data.length === 0){
                        grid.innerHTML = '<div class="empty">No se encontraron clientes</div>';
                        return;
                    }
                    grid.innerHTML = data.map(c => `
                        <div class="client-card">
                            <div class="top">
                                <span class="name">${c.name}</span>
                                <span class="status ${c.status === 'active' ? 'active' : 'inactive'}">${c.status.toUpperCase()}</span>
                            </div>
                            <div class="info">
                                <span>📱 ${c.whatsapp}</span>
                                <span>👁️ ${c.visits} visitas</span>
                                <span>⭐ ${c.points} pts</span>
                                <span>🏆 ${c.level}</span>
                            </div>
                            <div class="actions">
                                <button class="btn btn-edit" onclick="editClient(${c.id})">✏️ Editar</button>
                                <button class="btn btn-delete" onclick="openDelete(${c.id}, '${c.name}')">🗑️ Eliminar</button>
                            </div>
                        </div>
                    `).join('');
                })
                .catch(console.error);
        }
        
        function editClient(id){
            window.location.href = '/admin/clients/' + id + '/edit';
        }
        
        function openDelete(id, name){
            deleteId = id;
            document.getElementById('deleteClientName').textContent = 'Cliente: ' + name;
            document.getElementById('deleteModal').classList.add('show');
        }
        
        function closeModal(){
            document.getElementById('deleteModal').classList.remove('show');
            deleteId = null;
        }
        
        function confirmDelete(){
            if(!deleteId) return;
            fetch('/api/admin/clients/' + deleteId, {method: 'DELETE'})
                .then(res => res.json())
                .then(data => {
                    closeModal();
                    if(data.success){
                        loadClients();
                    }
                })
                .catch(console.error);
        }
        
        loadClients();
    </script>
</body>
</html>
