<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedidos - Club Etla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter',sans-serif; background:#f5efe8; min-height:100vh; padding:20px; }
        .container { max-width:800px; margin:0 auto; }
        .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; }
        .header h1 { color:#1a1a1a; font-size:24px; }
        .header a { color:#2d7a2d; text-decoration:none; font-weight:600; }
        .card { background:rgba(255,255,255,0.9); border-radius:20px; padding:20px; border:1px solid rgba(255,255,255,0.5); box-shadow:0 8px 32px rgba(0,0,0,0.04); margin-bottom:16px; }
        .order-row { display:flex; justify-content:space-between; align-items:center; padding:12px 0; border-bottom:1px solid rgba(0,0,0,0.05); gap:10px; flex-wrap:wrap; }
        .order-info .name { font-weight:700; color:#1a1a1a; }
        .order-info .detail { font-size:12px; color:#6a6a6a; }
        .order-actions button { border:none; border-radius:8px; padding:8px 14px; font-weight:700; cursor:pointer; font-size:13px; margin-left:6px; }
        .btn-validate { background:rgba(45,122,45,0.1); color:#2d7a2d; }
        .btn-reject { background:rgba(231,76,60,0.1); color:#e74c3c; }
        .empty { color:#999; font-size:13px; text-align:center; padding:20px 0; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📦 Pedidos por validar</h1>
            <a href="/admin">← Volver al panel</a>
        </div>
        <div class="card">
            {% if orders %}
                {% for o in orders %}
                <div class="order-row" id="order-{{ o.id }}">
                    <div class="order-info">
                        <div class="name">{{ o.client.name }}</div>
                        <div class="detail">Orden {{ o.order_number }} · {{ o.points_volume }} PV · ${{ o.total_amount }} · {{ o.order_date.strftime('%d/%m/%Y') }}</div>
                    </div>
                    <div class="order-actions">
                        <button class="btn-validate" onclick="validar({{ o.id }})">✓ Validar</button>
                        <button class="btn-reject" onclick="rechazar({{ o.id }})">✕ Rechazar</button>
                    </div>
                </div>
                {% endfor %}
            {% else %}
                <div class="empty">No hay pedidos pendientes de validación 🎉</div>
            {% endif %}
        </div>
    </div>
    <script>
        async function validar(id) {
            const res = await fetch(`/api/admin/orders/${id}/validate`, { method: 'PUT' });
            if (res.ok) document.getElementById(`order-${id}`).remove();
        }
        async function rechazar(id) {
            const res = await fetch(`/api/admin/orders/${id}/reject`, { method: 'PUT' });
            if (res.ok) document.getElementById(`order-${id}`).remove();
        }
    </script>
</body>
</html>
