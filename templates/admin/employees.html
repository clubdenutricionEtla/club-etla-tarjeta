<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestión de Empleados - Club Etla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: #f5efe8; min-height: 100vh; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .header h1 { color: #1a1a1a; font-size: 24px; }
        .header a { color: #2d7a2d; text-decoration: none; font-weight: 600; }
        .card { background: rgba(255,255,255,0.9); backdrop-filter: blur(12px); border-radius: 20px; padding: 24px; border: 1px solid rgba(255,255,255,0.5); box-shadow: 0 8px 32px rgba(0,0,0,0.04); margin-bottom: 20px; }
        .card h2 { font-size: 18px; color: #1a1a1a; margin-bottom: 16px; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 12px; font-weight: 600; color: #3a3a3a; margin-bottom: 4px; }
        .form-group input { width: 100%; padding: 10px 14px; border: 1px solid rgba(0,0,0,0.06); border-radius: 12px; font-size: 14px; background: #ffffff; transition: all 0.3s; }
        .form-group input:focus { border-color: #2d7a2d; outline: none; box-shadow: 0 0 0 3px rgba(45,122,45,0.06); }
        .btn { padding: 10px 24px; border: none; border-radius: 12px; font-weight: 600; font-size: 14px; cursor: pointer; transition: all 0.3s; }
        .btn-primary { background: linear-gradient(135deg, #2d7a2d, #4a8c2a); color: #fff; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(45,122,45,0.15); }
        .btn-danger { background: #e74c3c; color: #fff; }
        .btn-danger:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(231,76,60,0.15); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 10px 12px; text-align: left; border-bottom: 1px solid rgba(0,0,0,0.04); }
        th { font-size: 11px; text-transform: uppercase; color: #6a6a6a; font-weight: 600; letter-spacing: 0.5px; }
        td { font-size: 14px; color: #1a1a1a; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 10px; font-weight: 600; }
        .badge-active { background: rgba(45,122,45,0.1); color: #2d7a2d; }
        .badge-inactive { background: rgba(231,76,60,0.1); color: #e74c3c; }
        .message { padding: 12px 16px; border-radius: 12px; margin-bottom: 16px; display: none; }
        .message.success { display: block; background: rgba(45,122,45,0.06); border: 1px solid rgba(45,122,45,0.1); color: #2d7a2d; }
        .message.error { display: block; background: rgba(231,76,60,0.06); border: 1px solid rgba(231,76,60,0.1); color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 Gestión de Empleados</h1>
            <a href="/admin">← Volver</a>
        </div>

        <div class="card">
            <h2>➕ Agregar Empleado</h2>
            <div id="message" class="message"></div>
            <form id="employeeForm">
                <div class="form-group">
                    <label>Nombre completo</label>
                    <input type="text" id="name" placeholder="Ej: Juan Pérez" required />
                </div>
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="email" placeholder="Ej: juan@clubetla.com" required />
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" placeholder="Mínimo 6 caracteres" required minlength="6" />
                </div>
                <button type="submit" class="btn btn-primary">Registrar Empleado</button>
            </form>
        </div>

        <div class="card">
            <h2>📋 Empleados Registrados</h2>
            <table>
                <thead>
                    <tr>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Rol</th>
                        <th>Estado</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="employeesList">
                    <tr>
                        <td colspan="5" style="text-align:center; color:#8a8a8a; padding:20px;">Cargando empleados...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <script>
        async function loadEmployees() {
            try {
                const res = await fetch('/api/admin/employees');
                const data = await res.json();
                const tbody = document.getElementById('employeesList');
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; color:#8a8a8a; padding:20px;">No hay empleados registrados</td></tr>';
                    return;
                }
                tbody.innerHTML = data.map(e => `
                    <tr>
                        <td>${e.name}</td>
                        <td>${e.email}</td>
                        <td><span class="badge badge-${e.role === 'admin' ? 'active' : 'active'}">${e.role || 'empleado'}</span></td>
                        <td><span class="badge ${e.active ? 'badge-active' : 'badge-inactive'}">${e.active ? 'Activo' : 'Inactivo'}</span></td>
                        <td>
                            ${e.role !== 'admin' ? `<button class="btn btn-danger" style="padding:4px 12px; font-size:11px;" onclick="deleteEmployee(${e.id})">Eliminar</button>` : '—'}
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('employeeForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const message = document.getElementById('message');
            message.className = 'message';

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!name || !email || !password) {
                message.textContent = '⚠️ Completa todos los campos';
                message.className = 'message error';
                return;
            }

            try {
                const res = await fetch('/api/admin/employees', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                if (data.success) {
                    message.textContent = '✅ Empleado registrado exitosamente';
                    message.className = 'message success';
                    document.getElementById('employeeForm').reset();
                    loadEmployees();
                } else {
                    message.textContent = '❌ ' + (data.error || 'Error al registrar');
                    message.className = 'message error';
                }
            } catch (err) {
                message.textContent = '❌ Error de conexión';
                message.className = 'message error';
            }
        });

        async function deleteEmployee(id) {
            if (!confirm('¿Eliminar este empleado?')) return;
            try {
                const res = await fetch('/api/admin/employees/' + id, { method: 'DELETE' });
                const data = await res.json();
                if (data.success) {
                    loadEmployees();
                } else {
                    alert('Error al eliminar');
                }
            } catch (err) {
                alert('Error de conexión');
            }
        }

        loadEmployees();
    </script>
</body>
</html>
