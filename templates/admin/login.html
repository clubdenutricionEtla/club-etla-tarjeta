<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Login - Club Etla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Inter',sans-serif;background:#0a0a0a;color:white;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
        .container{max-width:380px;width:100%;}
        .back{color:rgba(255,255,255,0.1);text-decoration:none;font-size:13px;display:inline-block;margin-bottom:16px;}
        .back:hover{color:#00ff87;}
        
        .card{background:rgba(255,255,255,0.02);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.03);border-radius:24px;padding:28px;}
        .card h1{font-size:22px;background:linear-gradient(135deg,#00ff87,#00d4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-align:center;margin-bottom:4px;}
        .card .sub{text-align:center;color:rgba(255,255,255,0.1);font-size:12px;margin-bottom:20px;}
        
        .form-group{margin-bottom:14px;}
        .form-group label{display:block;font-size:12px;color:rgba(255,255,255,0.2);margin-bottom:4px;}
        .form-group input{width:100%;padding:12px 14px;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.03);border-radius:10px;color:white;font-size:14px;outline:none;}
        .form-group input:focus{border-color:rgba(0,255,135,0.08);}
        
        .error{display:none;padding:10px 14px;background:rgba(255,50,50,0.04);border:1px solid rgba(255,50,50,0.04);border-radius:10px;color:#ff6b6b;font-size:12px;margin-bottom:14px;}
        
        .btn{width:100%;padding:12px;border:none;border-radius:10px;font-size:15px;font-weight:700;cursor:pointer;transition:all 0.3s;}
        .btn-primary{background:linear-gradient(135deg,#00ff87,#00d4ff);color:#0a0a0a;}
        .btn-primary:hover{transform:scale(1.02);}
        
        .info{text-align:center;color:rgba(255,255,255,0.03);font-size:10px;margin-top:12px;}
    </style>
</head>
<body>
    <div class="container">
        <a href="/" class="back">← Volver</a>
        
        <div class="card">
            <h1>⚙️ Admin</h1>
            <p class="sub">Acceso al panel de administración</p>
            
            <div id="error" class="error"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label>📧 Email</label>
                    <input type="email" id="email" placeholder="admin@clubetla.com" value="admin@clubetla.com">
                </div>
                <div class="form-group">
                    <label>🔒 Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" value="admin123">
                </div>
                <button type="submit" class="btn btn-primary">Ingresar →</button>
            </form>
            
            <div class="info">admin@clubetla.com / admin123</div>
        </div>
    </div>
    
    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const error = document.getElementById('error');
            const btn = this.querySelector('button');
            
            error.style.display = 'none';
            btn.textContent = '⏳ Verificando...';
            btn.disabled = true;
            
            try {
                const res = await fetch('/employee/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/x-www-form-urlencoded'},
                    body: 'email=' + encodeURIComponent(email) + '&password=' + encodeURIComponent(password)
                });
                const data = await res.json();
                
                if(data.success){
                    window.location.href = data.redirect;
                } else {
                    error.style.display = 'block';
                    error.textContent = '❌ ' + (data.error || 'Credenciales inválidas');
                }
            } catch(e) {
                error.style.display = 'block';
                error.textContent = '❌ Error de conexión';
            } finally {
                btn.textContent = 'Ingresar →';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
