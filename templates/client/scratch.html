<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rascar - Club Etla</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{
            font-family:'Inter',sans-serif;
            background:#0a0a0a;
            color:white;
            min-height:100vh;
            display:flex;
            align-items:center;
            justify-content:center;
            overflow:hidden;
            touch-action:none;
            user-select:none;
            -webkit-user-select:none;
        }

        .bg{
            position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;
            background:radial-gradient(ellipse at 50% 50%, #0a0a0a, #050505);
            overflow:hidden;
        }
        .bg .orb{
            position:absolute;border-radius:50%;filter:blur(120px);opacity:0.2;
            animation:orbFloat 25s ease-in-out infinite;
        }
        .bg .orb:nth-child(1){width:500px;height:500px;background:#00ff41;top:-200px;left:-200px;animation-delay:0s;}
        .bg .orb:nth-child(2){width:600px;height:600px;background:#ffd700;bottom:-250px;right:-250px;animation-delay:5s;}
        .bg .orb:nth-child(3){width:400px;height:400px;background:#00d4ff;top:40%;left:30%;animation-delay:10s;}
        @keyframes orbFloat{
            0%,100%{transform:translate(0,0)scale(1);}
            25%{transform:translate(80px,-120px)scale(1.2);}
            50%{transform:translate(-50px,100px)scale(0.8);}
            75%{transform:translate(60px,60px)scale(1.1);}
        }

        .container{
            max-width:440px;
            width:100%;
            padding:12px;
            position:relative;
            z-index:1;
            display:flex;
            flex-direction:column;
            align-items:center;
            justify-content:center;
            min-height:100vh;
        }

        .back{
            color:rgba(255,255,255,0.1);
            text-decoration:none;
            font-size:12px;
            display:inline-block;
            margin-bottom:8px;
            transition:color 0.3s;
            align-self:flex-start;
        }
        .back:hover{color:#00ff87;}

        .scratch-card{
            background:rgba(255,255,255,0.02);
            backdrop-filter:blur(30px);
            border:1px solid rgba(255,255,255,0.03);
            border-radius:24px;
            padding:16px 16px 12px;
            width:100%;
            box-shadow:0 30px 80px rgba(0,0,0,0.5);
            position:relative;
            overflow:hidden;
        }

        .scratch-card .header{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:10px;
            padding:0 4px;
        }
        .scratch-card .header .logo{
            display:flex;
            align-items:center;
            gap:8px;
        }
        .scratch-card .header .logo .icon{
            width:32px;height:32px;
            background:linear-gradient(135deg,#00ff87,#00d4ff);
            border-radius:8px;
            display:flex;align-items:center;justify-content:center;
            font-size:16px;
            font-weight:900;
            color:#0a0a0a;
        }
        .scratch-card .header .logo .text{
            font-size:11px;
            font-weight:600;
            color:rgba(255,255,255,0.4);
            letter-spacing:1px;
        }
        .scratch-card .header .level{
            font-size:10px;
            font-weight:700;
            color:#ffd700;
            padding:4px 12px;
            background:rgba(255,215,0,0.06);
            border-radius:12px;
            border:1px solid rgba(255,215,0,0.06);
        }

        .scratch-card .user-info{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-bottom:10px;
            padding:0 4px;
        }
        .scratch-card .user-info .name{
            font-size:15px;
            font-weight:700;
            color:white;
        }
        .scratch-card .user-info .id{
            font-size:10px;
            color:rgba(255,255,255,0.1);
            font-family:monospace;
            letter-spacing:1px;
        }

        .canvas-wrapper{
            position:relative;
            width:100%;
            max-width:400px;
            margin:0 auto;
            border-radius:16px;
            overflow:hidden;
            border:1px solid rgba(255,255,255,0.03);
            background:#0a0a0a;
            box-shadow:0 0 60px rgba(0,255,135,0.02);
            touch-action:none;
        }
        #scratchCanvas{
            width:100%;
            height:auto;
            display:block;
            touch-action:none;
            cursor:pointer;
            background:#0a0a0a;
        }

        .scratch-card .footer{
            display:flex;
            justify-content:space-between;
            align-items:center;
            margin-top:10px;
            padding:0 4px;
        }
        .scratch-card .footer .qr{
            width:32px;height:32px;
            background:rgba(255,255,255,0.02);
            border-radius:6px;
            display:flex;align-items:center;justify-content:center;
            font-size:14px;
            color:rgba(255,255,255,0.1);
        }
        .scratch-card .footer .visits{
            font-size:10px;
            color:rgba(255,255,255,0.1);
            letter-spacing:1px;
        }
        .scratch-card .footer .date{
            font-size:9px;
            color:rgba(255,255,255,0.06);
        }

        /* ===== MODAL RESULTADO ===== */
        .result-modal{
            display:none;
            position:fixed;
            top:0;left:0;
            width:100%;height:100%;
            background:rgba(0,0,0,0.95);
            z-index:999;
            align-items:center;
            justify-content:center;
            padding:20px;
            backdrop-filter:blur(40px);
            animation:fadeIn 0.6s ease-out;
        }
        .result-modal.show{display:flex;}
        @keyframes fadeIn{from{opacity:0;transform:scale(0.95);}to{opacity:1;transform:scale(1);}}

        .result-modal .modal-content{
            background:linear-gradient(145deg,#1a1a2e,#0f0f1f);
            border:1px solid rgba(0,255,135,0.06);
            border-radius:28px;
            padding:32px 24px;
            max-width:380px;
            width:100%;
            text-align:center;
            position:relative;
            overflow:hidden;
        }
        .result-modal .modal-content::before{
            content:'';
            position:absolute;
            top:-50%;left:-50%;
            width:200%;height:200%;
            background:conic-gradient(from 0deg, transparent, rgba(0,255,135,0.02), transparent, rgba(255,215,0,0.02), transparent);
            animation:spin 20s linear infinite;
            pointer-events:none;
        }
        @keyframes spin{100%{transform:rotate(360deg);}}

        .result-modal .modal-content .inner{position:relative;z-index:1;}
        .result-modal .modal-content .big-icon{font-size:72px;display:block;margin-bottom:6px;}
        .result-modal .modal-content h2{font-size:22px;font-weight:800;color:#ffd700;}
        .result-modal .modal-content .sub-text{
            font-size:14px;
            color:#00ff87;
            font-weight:700;
            margin:6px 0 10px;
            text-shadow:0 0 30px rgba(0,255,135,0.2);
        }
        .result-modal .modal-content .prize-name{
            font-size:24px;
            font-weight:700;
            color:#ffffff;
            padding:8px 16px;
            background:rgba(0,255,135,0.04);
            border-radius:12px;
            display:inline-block;
            margin-bottom:16px;
            border:1px solid rgba(0,255,135,0.04);
        }
        .result-modal .modal-content .btn-row{
            display:flex;
            gap:10px;
            justify-content:center;
            flex-wrap:wrap;
        }
        .result-modal .modal-content .btn-claim{
            padding:12px 24px;
            border:none;
            border-radius:14px;
            background:linear-gradient(135deg,#25D366,#128C7E);
            color:white;
            font-size:14px;
            font-weight:700;
            cursor:pointer;
            transition:all 0.3s;
            flex:1;
            min-width:120px;
            display:flex;
            align-items:center;
            justify-content:center;
            gap:8px;
        }
        .result-modal .modal-content .btn-claim:hover{transform:scale(1.04);}
        .result-modal .modal-content .btn-back{
            padding:12px 24px;
            border:1px solid rgba(255,255,255,0.04);
            border-radius:14px;
            background:rgba(255,255,255,0.03);
            color:rgba(255,255,255,0.3);
            font-size:14px;
            font-weight:600;
            cursor:pointer;
            transition:all 0.3s;
            flex:1;
            min-width:120px;
        }
        .result-modal .modal-content .btn-back:hover{
            background:rgba(255,255,255,0.06);
            color:rgba(255,255,255,0.5);
        }

        .toast{
            position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
            padding:10px 20px;
            background:linear-gradient(135deg,#00ff87,#00d4ff);
            border-radius:12px;
            color:#0a0a0a;
            font-weight:700;
            font-size:13px;
            display:none;z-index:1000;
            animation:toastUp 0.4s ease-out;
            box-shadow:0 4px 40px rgba(0,255,135,0.15);
        }
        @keyframes toastUp{from{opacity:0;transform:translateX(-50%) translateY(15px);}to{opacity:1;transform:translateX(-50%) translateY(0);}

        .confetti-piece{
            position:fixed;
            width:8px;height:8px;
            pointer-events:none;
            z-index:1000;
            animation:confettiFall var(--duration) linear forwards;
        }
        @keyframes confettiFall{
            0%{transform:translateY(0) rotate(0deg) scale(1); opacity:1;}
            100%{transform:translateY(110vh) rotate(720deg) scale(0.3); opacity:0;}
        }

        @media(max-width:400px){
            .container{padding:8px;}
            .scratch-card{padding:12px 12px 10px;border-radius:20px;}
            .scratch-card .header .logo .icon{width:28px;height:28px;font-size:14px;}
            .scratch-card .user-info .name{font-size:13px;}
            .result-modal .modal-content{padding:24px 16px;}
            .result-modal .modal-content .big-icon{font-size:56px;}
            .result-modal .modal-content .btn-row{flex-direction:column;}
        }
    </style>
</head>
<body>

<div class="bg">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
</div>

<div id="toast" class="toast"></div>

<div class="container">
    <a href="/card" class="back">← Volver a mi tarjeta</a>

    <div class="scratch-card">
        <div class="header">
            <div class="logo">
                <div class="icon">🥤</div>
                <div class="text">MI CLUB ETLA</div>
            </div>
            <div class="level">{{ level_data.icon }} {{ client.get_level() }}</div>
        </div>

        <div class="user-info">
            <div class="name">👤 {{ client.name }}</div>
            <div class="id">#{{ client.id }}</div>
        </div>

        <div class="canvas-wrapper">
            <canvas id="scratchCanvas" width="400" height="400"></canvas>
        </div>

        <div class="footer">
            <div class="qr">◈</div>
            <div class="visits">🎯 {{ client.visits }} visitas</div>
            <div class="date">{{ client.registration_date.strftime('%d/%m/%Y') }}</div>
        </div>
    </div>
</div>

<!-- ===== MODAL RESULTADO ===== -->
<div class="result-modal" id="resultModal">
    <div class="modal-content">
        <div class="inner">
            <span class="big-icon" id="resultIcon">🎉</span>
            <h2 id="resultTitle">🎉 ¡Felicidades!</h2>
            <div class="sub-text" id="resultDesc">¡Bienvenido al Club de Nutrición Etla!</div>
            <div class="prize-name" id="resultPrize">🎁 Premio</div>
            <div class="btn-row">
                <button class="btn-claim" onclick="sendToWhatsApp()">
                    <span>📱</span> Reclamar por WhatsApp
                </button>
                <button class="btn-back" onclick="goBack()">← Volver</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
<script>
    // ========================================
    // DATOS DEL CLIENTE
    // ========================================
    const clientName = "{{ client.name }}";
    const clientWhatsApp = "{{ client.whatsapp }}";
    const clientId = "{{ client.id }}";
    const CLUB_WHATSAPP = "5219512470417";

    let isRevealed = false;
    let isDrawing = false;
    let prizeClaimed = false;
    let currentReward = null;
    let lastPos = null;

    // ========================================
    // REWARDS
    // ========================================
    const REWARDS = {
        'CUPCAKE': { name: '🧁 Cupcake Gratis', icon: '🧁' },
        'COFFEE': { name: '☕ Café Herbalife Individual', icon: '☕' },
        'TEA': { name: '🍵 Té Individual', icon: '🍵' },
        'ALOE': { name: '🌿 Aloe Individual', icon: '🌿' },
        'PROTEIN': { name: '💪 Porción de Proteína Extra', icon: '💪' }
    };
    const SERVER_REWARD = "{{ client.scratch_reward or '' }}";
    const IS_WELCOME = {{ 'true' if is_welcome else 'false' }};

    // ========================================
    // CANVAS
    // ========================================
    const canvas = document.getElementById('scratchCanvas');
    const ctx = canvas.getContext('2d');
    const W = 400, H = 400;
    canvas.width = W;
    canvas.height = H;

    // ===== DIBUJAR PREMIO (FONDO) =====
    function drawPrize(){
        const keys = Object.keys(REWARDS);
        const rewardKey = (SERVER_REWARD && REWARDS[SERVER_REWARD]) ? SERVER_REWARD : keys[0];
        currentReward = rewardKey;
        const reward = REWARDS[rewardKey];

        // Fondo con gradiente de colores vivos
        const grad = ctx.createRadialGradient(W/2, H/2, 20, W/2, H/2, 200);
        grad.addColorStop(0, '#1a1a3e');
        grad.addColorStop(0.3, '#0f0f2e');
        grad.addColorStop(0.6, '#0a0a1a');
        grad.addColorStop(1, '#050510');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Borde dorado con glow
        ctx.shadowColor = 'rgba(255,215,0,0.1)';
        ctx.shadowBlur = 20;
        ctx.strokeStyle = 'rgba(255,215,0,0.08)';
        ctx.lineWidth = 2;
        ctx.strokeRect(15, 15, W-30, H-30);
        ctx.shadowBlur = 0;

        // Icono del premio con glow
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.font = '80px Inter, sans-serif';
        ctx.shadowColor = 'rgba(255,255,255,0.15)';
        ctx.shadowBlur = 40;
        ctx.fillStyle = '#ffffff';
        ctx.fillText(reward.icon, W/2, H/2 - 30);
        ctx.shadowBlur = 0;

        // Nombre del premio con glow verde
        ctx.font = 'bold 24px Inter, sans-serif';
        ctx.fillStyle = '#00ff87';
        ctx.shadowColor = 'rgba(0,255,135,0.3)';
        ctx.shadowBlur = 25;
        ctx.fillText(reward.name, W/2, H/2 + 45);
        ctx.shadowBlur = 0;

        // Texto
        ctx.font = '11px Inter, sans-serif';
        ctx.fillStyle = 'rgba(255,215,0,0.08)';
        ctx.fillText('✦ PREMIO ESPECIAL ✦', W/2, H/2 + 85);

        // Partículas decorativas de colores
        const colors = ['#00ff87', '#00d4ff', '#ffd700', '#ff00ff', '#ff6b00'];
        for(let i=0;i<30;i++){
            const angle = Math.random() * Math.PI * 2;
            const radius = 90 + Math.random() * 70;
            const x = W/2 + Math.cos(angle) * radius;
            const y = H/2 + Math.sin(angle) * radius;
            ctx.beginPath();
            ctx.arc(x, y, Math.random()*3+1, 0, Math.PI*2);
            ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)] + '15';
            ctx.fill();
        }
    }

    // ===== DIBUJAR CAPA PLATEADA CON EFECTO METÁLICO =====
    function drawSilverLayer(){
        ctx.globalCompositeOperation = 'source-over';

        // Fondo plateado con reflejos
        const grad = ctx.createLinearGradient(0, 0, W, H);
        grad.addColorStop(0, '#d4d4d4');
        grad.addColorStop(0.15, '#f0f0f0');
        grad.addColorStop(0.3, '#c8c8c8');
        grad.addColorStop(0.5, '#e8e8e8');
        grad.addColorStop(0.7, '#d0d0d0');
        grad.addColorStop(0.85, '#f0f0f0');
        grad.addColorStop(1, '#c0c0c0');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, W, H);

        // Textura metálica (más sutil)
        for(let i=0;i<4000;i++){
            const x = Math.random()*W;
            const y = Math.random()*H;
            const alpha = Math.random()*0.06;
            ctx.fillStyle = `rgba(255,255,255,${alpha})`;
            ctx.fillRect(x, y, Math.random()*4+1, Math.random()*4+1);
        }

        // Reflejos holográficos
        const shine1 = ctx.createRadialGradient(W/2-120, H/2-120, 20, W/2, H/2, 200);
        shine1.addColorStop(0, 'rgba(0,255,135,0.04)');
        shine1.addColorStop(0.3, 'rgba(255,215,0,0.03)');
        shine1.addColorStop(0.6, 'rgba(0,212,255,0.02)');
        shine1.addColorStop(1, 'transparent');
        ctx.fillStyle = shine1;
        ctx.fillRect(0, 0, W, H);

        const shine2 = ctx.createRadialGradient(W/2+80, H/2+80, 20, W/2, H/2, 180);
        shine2.addColorStop(0, 'rgba(255,0,255,0.03)');
        shine2.addColorStop(1, 'transparent');
        ctx.fillStyle = shine2;
        ctx.fillRect(0, 0, W, H);

        // Borde con efecto metálico
        ctx.strokeStyle = 'rgba(255,255,255,0.03)';
        ctx.lineWidth = 2;
        ctx.strokeRect(8, 8, W-16, H-16);

        // Texto "RASPA AQUÍ" con efecto neón
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.shadowColor = 'rgba(0,255,135,0.05)';
        ctx.shadowBlur = 20;
        ctx.font = 'bold 34px Inter, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.15)';
        ctx.fillText('✧ RASPA AQUÍ ✧', W/2, H/2 - 20);
        ctx.font = '16px Inter, sans-serif';
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.fillText('desliza tu dedo', W/2, H/2 + 35);
        ctx.shadowBlur = 0;

        // Flecha
        ctx.font = '28px Inter, sans-serif';
        ctx.fillStyle = 'rgba(255,215,0,0.06)';
        ctx.fillText('↓', W/2, H/2 + 75);

        ctx.globalCompositeOperation = 'source-over';
    }

    // ===== INICIALIZAR =====
    function initCanvas(){
        drawPrize();
        drawSilverLayer();
        isRevealed = false;
        prizeClaimed = false;
        lastPos = null;
        document.getElementById('resultModal').classList.remove('show');
    }

    // ===== VERIFICAR REVELADO (15%) =====
    function checkReveal(){
        const imageData = ctx.getImageData(0, 0, W, H);
        const data = imageData.data;
        let transparent = 0;
        for(let i=3; i<data.length; i+=4){
            if(data[i] === 0) transparent++;
        }
        const percent = (transparent / (W*H)) * 100;

        if(percent >= 15 && !isRevealed){
            isRevealed = true;
            revealPrize();
        }
    }

    // ===== REVELAR PREMIO =====
    function revealPrize(){
        // Efecto de revelado suave
        ctx.globalCompositeOperation = 'destination-out';
        ctx.fillStyle = 'rgba(255,255,255,1)';
        ctx.fillRect(0, 0, W, H);
        ctx.globalCompositeOperation = 'source-over';
        drawPrize();

        const reward = REWARDS[currentReward];
        
        document.getElementById('resultIcon').textContent = reward.icon;
        document.getElementById('resultTitle').textContent = '🎉 ¡Felicidades!';
        document.getElementById('resultDesc').textContent = IS_WELCOME ? '¡Visita el Club de Nutrición Etla para reclamar tu cupcake! 🧁' : '¡Gracias por tu visita número 5!';
        document.getElementById('resultPrize').textContent = reward.name;
        document.getElementById('resultModal').classList.add('show');

        launchConfetti();

        if(navigator.vibrate){
            navigator.vibrate([100, 50, 100, 50, 200]);
        }

        if(!prizeClaimed){
            prizeClaimed = true;
            fetch(IS_WELCOME ? '/api/scratch/welcome/claim' : '/api/scratch/claim', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ reward: currentReward })
            })
            .then(res => res.json())
            .then(data => {
                if(data.success){
                    console.log('✅ Premio guardado:', data.reward_name);
                }
            })
            .catch(err => console.error('❌ Error:', err));
        }
    }

    // ===== CONFETTI =====
    function launchConfetti(){
        confetti({
            particleCount: 200,
            spread: 100,
            origin: { y: 0.5 },
            colors: ['#ffd700', '#ff6b00', '#00ff41', '#ff00ff', '#00d4ff', '#ff2d78']
        });
        setTimeout(() => {
            confetti({
                particleCount: 150,
                spread: 80,
                origin: { y: 0.4 },
                colors: ['#ffd700', '#ff6b00', '#00ff41']
            });
        }, 300);
        setTimeout(() => {
            confetti({
                particleCount: 100,
                spread: 60,
                origin: { y: 0.6 },
                colors: ['#ff00ff', '#00d4ff', '#ff2d78']
            });
        }, 600);
        
        const colors = ['#ffd700', '#ff6b00', '#00ff41', '#ff00ff', '#00d4ff'];
        for(let i=0;i<80;i++){
            const color = colors[Math.floor(Math.random() * colors.length)];
            const el = document.createElement('div');
            el.className = 'confetti-piece';
            el.style.left = Math.random() * 100 + '%';
            el.style.top = Math.random() * 40 + '%';
            el.style.background = color;
            el.style.width = (5 + Math.random() * 8) + 'px';
            el.style.height = (5 + Math.random() * 8) + 'px';
            el.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
            el.style.setProperty('--duration', (2 + Math.random() * 3) + 's');
            el.style.animationDelay = Math.random() * 0.5 + 's';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 5000);
        }
    }

    // ===== ENVIAR POR WHATSAPP =====
    function sendToWhatsApp(){
        const reward = REWARDS[currentReward];
        
        const message = `🎁 *PREMIOS CLUB ETLA* %0A%0A` +
                        `👤 *Cliente:* ${clientName}%0A` +
                        `🎯 *Premio:* ${reward.name}%0A` +
                        `📱 *WhatsApp:* ${clientWhatsApp}%0A` +
                        `🏷️ *ID:* #${clientId}%0A` +
                        `📅 *Fecha:* ${new Date().toLocaleDateString()}%0A%0A` +
                        `🌟 *¡Gracias por confiar en Club Etla!*`;

        const url = `https://wa.me/${CLUB_WHATSAPP}?text=${message}`;
        window.open(url, '_blank');
        
        downloadPrizeImage();
        showToast('📤 Abriendo WhatsApp...');
    }

    // ===== DESCARGAR IMAGEN =====
    function downloadPrizeImage(){
        const link = document.createElement('a');
        link.download = `premio_${clientName}_${currentReward}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
    }

    // ===== VOLVER =====
    function goBack(){
        document.getElementById('resultModal').classList.remove('show');
        setTimeout(() => window.location.href = '/card', 300);
    }

    // ===== TOAST =====
    function showToast(msg){
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.style.display = 'block';
        t.style.animation = 'none';
        setTimeout(() => t.style.animation = 'toastUp 0.4s ease-out', 10);
        clearTimeout(t._hide);
        t._hide = setTimeout(() => { t.style.display = 'none'; }, 4000);
    }

    // ===== POSICIÓN =====
    function getPos(e){
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        let cx, cy;
        if(e.touches){
            cx = e.touches[0].clientX;
            cy = e.touches[0].clientY;
            e.preventDefault();
        } else {
            cx = e.clientX;
            cy = e.clientY;
        }
        return {
            x: Math.min(Math.max((cx - rect.left) * scaleX, 0), W),
            y: Math.min(Math.max((cy - rect.top) * scaleY, 0), H)
        };
    }

    // ===== RASPAR (más fluido con interpolación) =====
    function scratch(pos){
        if(isRevealed) return;
        
        // Interpolación para movimiento más fluido
        if(lastPos){
            const steps = 5;
            for(let s=0; s<steps; s++){
                const t = s / steps;
                const ix = lastPos.x + (pos.x - lastPos.x) * t;
                const iy = lastPos.y + (pos.y - lastPos.y) * t;
                
                // Partículas de colores al raspar
                for(let i=0;i<8;i++){
                    const angle = Math.random() * Math.PI * 2;
                    const dist = 2 + Math.random() * 15;
                    const dx = Math.cos(angle) * dist;
                    const dy = Math.sin(angle) * dist;
                    const size = 1 + Math.random() * 3;
                    ctx.globalCompositeOperation = 'source-over';
                    ctx.beginPath();
                    ctx.arc(ix + dx, iy + dy, size, 0, Math.PI * 2);
                    const colors = ['rgba(0,255,135,', 'rgba(0,212,255,', 'rgba(255,215,0,', 'rgba(255,0,255,', 'rgba(255,255,255,'];
                    ctx.fillStyle = colors[Math.floor(Math.random() * colors.length)] + (0.3 + Math.random() * 0.5) + ')';
                    ctx.fill();
                }

                // Raspar la capa
                ctx.globalCompositeOperation = 'destination-out';
                ctx.beginPath();
                ctx.arc(ix, iy, 40, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalCompositeOperation = 'source-over';
            }
        } else {
            // Primer punto
            for(let i=0;i<5;i++){
                const angle = Math.random() * Math.PI * 2;
                const dist = 2 + Math.random() * 10;
                const dx = Math.cos(angle) * dist;
                const dy = Math.sin(angle) * dist;
                ctx.globalCompositeOperation = 'source-over';
                ctx.beginPath();
                ctx.arc(pos.x + dx, pos.y + dy, 1 + Math.random() * 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fill();
            }
            ctx.globalCompositeOperation = 'destination-out';
            ctx.beginPath();
            ctx.arc(pos.x, pos.y, 40, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalCompositeOperation = 'source-over';
        }
        
        lastPos = {x: pos.x, y: pos.y};
        checkReveal();
    }

    // ===== EVENTOS =====
    canvas.addEventListener('mousedown', (e) => {
        isDrawing = true;
        lastPos = null;
        scratch(getPos(e));
    });
    canvas.addEventListener('mousemove', (e) => {
        if(isDrawing && !isRevealed) scratch(getPos(e));
    });
    canvas.addEventListener('mouseup', () => { isDrawing = false; lastPos = null; });
    canvas.addEventListener('mouseleave', () => { isDrawing = false; lastPos = null; });

    canvas.addEventListener('touchstart', (e) => {
        isDrawing = true;
        lastPos = null;
        scratch(getPos(e));
    }, { passive: false });
    canvas.addEventListener('touchmove', (e) => {
        if(isDrawing && !isRevealed) scratch(getPos(e));
    }, { passive: false });
    canvas.addEventListener('touchend', () => { isDrawing = false; lastPos = null; });

    // ===== INICIAR =====
    initCanvas();

    console.log('🏆 Rascadita Premium - Club Etla');
    console.log('👤 Cliente:', clientName);
    console.log('📱 WhatsApp:', clientWhatsApp);
</script>

</body>
</html>
