<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Club Etla - Escáner QR</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: radial-gradient(ellipse 100% 80% at 10% 15%, rgba(200,255,200,0.30) 0%, transparent 70%),
                        radial-gradient(ellipse 90% 70% at 5% 85%, rgba(140,210,140,0.25) 0%, transparent 65%),
                        #f5efe8;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .container { max-width: 480px; width: 100%; }
        .header { text-align: center; margin-bottom: 16px; }
        .header h1 { font-size: 22px; color: #1a1a1a; }
        .header p { color: #6a6a6a; font-size: 14px; }
        .card {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px);
            border-radius: 28px;
            padding: 24px 20px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: 0 20px 60px rgba(0,0,0,0.04);
        }
        .camera-area {
            width: 100%;
            aspect-ratio: 1/0.8;
            background: rgba(0,0,0,0.03);
            border-radius: 16px;
            border: 2px dashed rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 16px;
            overflow: hidden;
            position: relative;
        }
        .camera-area video { width: 100%; height: 100%; object-fit: cover; display: none; }
        .camera-area.scanning video { display: block; }
        .camera-area .icon { font-size: 48px; opacity: 0.15; }
        .camera-area .hint { font-size: 13px; color: #6a6a6a; text-align: center; }
        .camera-area.scanning .icon, .camera-area.scanning .hint { display: none; }
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn-primary {
            background: linear-gradient(135deg, #2d7a2d, #4a8c2a);
            color: #fff;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(45,122,45,0.15); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: rgba(0,0,0,0.04);
            color: #1a1a1a;
            border: 1px solid rgba(0,0,0,0.04);
        }
        .btn-secondary:hover { background: rgba(0,0,0,0.06); }
        .result {
            margin-top: 16px;
            padding: 16px;
            border-radius: 14px;
            background: rgba(45,122,45,0.04);
            border: 1px solid rgba(45,122,45,0.08);
            display: none;
            animation: fadeUp 0.3s ease;
        }
        .result.visible { display: block; }
        .result .status { font-size: 14px; font-weight: 700; color: #2d7a2d; }
        .result .name { font-size: 20px; font-weight: 800; color: #1a1a1a; margin: 4px 0; }
        .result .visits { font-size: 14px; color: #6a6a6a; }
        .result .visits strong { color: #2d7a2d; font-weight: 700; }
        .message { padding: 12px; border-radius: 12px; margin-bottom: 12px; display: none; background: rgba(231,76,60,0.06); border: 1px solid rgba(231,76,60,0.1); color: #e74c3c; }
        .message.visible { display: block; }
        .back-link { display: block; text-align: center; margin-top: 12px; color: #2d7a2d; text-decoration: none; font-weight: 600; font-size: 14px; }
        .reward-box { margin-top: 12px; padding: 16px; border-radius: 14px; background: rgba(255,193,7,0.08); border: 1px solid rgba(255,193,7,0.25); display: none; }
        .reward-box.visible { display: block; }
        .reward-box .label { font-size: 13px; color: #8a6d00; font-weight: 700; }
        .reward-box .prize { font-size: 18px; font-weight: 800; color: #1a1a1a; margin: 4px 0 12px; }
        .btn-redeem { background: linear-gradient(135deg, #e0a800, #ffc107); color: #1a1a1a; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 400px) {
            .card { padding: 18px 14px; }
            .header h1 { font-size: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📷 Escanear QR</h1>
            <p>Registra la visita de un cliente</p>
        </div>
        <div class="card">
            <div id="message" class="message"></div>
            <div class="camera-area" id="cameraArea">
                <span class="icon">📷</span>
                <span class="hint">Activa la cámara para escanear</span>
                <video id="video" playsinline></video>
                <canvas id="canvas" style="display:none;"></canvas>
            </div>
            <button class="btn btn-primary" id="scanBtn">📸 Iniciar escáner</button>
            <div class="result" id="result">
                <div class="status">✅ Visita registrada</div>
                <div class="name" id="clientName">-</div>
                <div class="visits">Visita <strong id="visitNumber">0</strong> de 10</div>
            </div>
            <div class="reward-box" id="rewardBox">
                <div class="label">🎁 Premio pendiente de canje</div>
                <div class="prize" id="rewardName">-</div>
                <button class="btn btn-redeem" id="redeemBtn">✅  Marcar como canjeado</button>
            </div>
            <a href="/employee" class="back-link">← Volver al panel</a>
        </div>
    </div>
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const canvasCtx = canvas.getContext('2d', { willReadFrequently: true });
        const cameraArea = document.getElementById('cameraArea');
        const scanBtn = document.getElementById('scanBtn');
        const result = document.getElementById('result');
        const clientNameEl = document.getElementById('clientName');
        const visitNumberEl = document.getElementById('visitNumber');
        const message = document.getElementById('message');

        let scannerActive = false;
        let stream = null;
        let rafId = null;
        let processingRequest = false;
        let cooldownUntil = 0;

        function showMessage(text) {
            message.textContent = text;
            message.classList.add('visible');
            setTimeout(() => message.classList.remove('visible'), 3000);
        }

        async function startCamera() {
            try {
                stream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'environment' }
                });
                video.srcObject = stream;
                await video.play();
                cameraArea.classList.add('scanning');
                scanBtn.textContent = '⏹ Detener escáner';
                scannerActive = true;
                requestAnimationFrame(tick);
            } catch (err) {
                showMessage('⚠️ No se pudo acceder a la cámara. Permite el acceso.');
                console.error('Camera error:', err);
            }
        }

        function stopCamera() {
            if (stream) {
                stream.getTracks().forEach(track => track.stop());
                stream = null;
            }
            video.srcObject = null;
            cameraArea.classList.remove('scanning');
            scanBtn.textContent = '📸 Iniciar escáner';
            scannerActive = false;
            if (rafId) {
                cancelAnimationFrame(rafId);
                rafId = null;
            }
        }

        function tick() {
            if (!scannerActive) return;

            if (video.readyState === video.HAVE_ENOUGH_DATA && !processingRequest && Date.now() > cooldownUntil) {
                canvas.width = video.videoWidth;
                canvas.height = video.videoHeight;
                canvasCtx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = canvasCtx.getImageData(0, 0, canvas.width, canvas.height);
                const code = jsQR(imageData.data, imageData.width, imageData.height, {
                    inversionAttempts: 'dontInvert'
                });

                if (code && code.data && !processingRequest) {
                    handleScan(code.data);
                }
            }

            rafId = requestAnimationFrame(tick);
        }

        async function handleScan(qrSecret) {
            processingRequest = true;
            scanBtn.disabled = true;
            try {
                const response = await fetch('/api/employee/scan', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ qr_secret: qrSecret, product_type: 'BREAKFAST' })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    clientNameEl.textContent = data.client_name;
                    visitNumberEl.textContent = data.visits;
                    result.classList.add('visible');
                    stopCamera();
                    checkReward(qrSecret);
                } else {
                    showMessage(data.error || 'No se pudo registrar la visita');
                    cooldownUntil = Date.now() + 2000;
                }
            } catch (err) {
                showMessage('⚠️ Error de conexión al registrar la visita');
                console.error('Scan error:', err);
                cooldownUntil = Date.now() + 2000;
            } finally {
                processingRequest = false;
                scanBtn.disabled = false;
            }
        }

        const rewardBox = document.getElementById('rewardBox');
        const rewardNameEl = document.getElementById('rewardName');
        const redeemBtn = document.getElementById('redeemBtn');
        let currentQrSecret = null;

        async function checkReward(qrSecret) {
            currentQrSecret = qrSecret;
            try {
                const response = await fetch('/api/employee/check-reward', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ qr_secret: qrSecret })
                });
                const data = await response.json();
                if (response.ok && data.pending_reward) {
                    rewardNameEl.textContent = data.reward_name;
                    rewardBox.classList.add('visible');
                } else {
                    rewardBox.classList.remove('visible');
                }
            } catch (err) {
                console.error('Check reward error:', err);
            }
        }

        redeemBtn.addEventListener('click', async function() {
            if (!currentQrSecret) return;
            redeemBtn.disabled = true;
            try {
                const response = await fetch('/api/employee/redeem-scratch', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ qr_secret: currentQrSecret })
                });
                const data = await response.json();
                if (response.ok && data.success) {
                    showMessage(data.message);
                    rewardBox.classList.remove('visible');
                } else {
                    showMessage(data.error || 'No se pudo canjear el premio');
                }
            } catch (err) {
                showMessage('⚠️ Error de conexión al canjear');
                console.error('Redeem error:', err);
            } finally {
                redeemBtn.disabled = false;
            }
        });

        scanBtn.addEventListener('click', function() {
            if (scannerActive) {
                stopCamera();
                result.classList.remove('visible');
            } else {
                startCamera();
                result.classList.remove('visible');
                message.classList.remove('visible');
            }
        });

        window.addEventListener('beforeunload', function() {
            stopCamera();
        });
    </script>
</body>
</html>
